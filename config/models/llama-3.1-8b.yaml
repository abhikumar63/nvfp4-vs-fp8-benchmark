experiment:
  name: "llama_3.1_8b_nvfp4_vs_fp8"
  seed: 42
  device: "cuda"

model:
  name_or_path: "meta-llama/Llama-3.1-8B"
  torch_dtype: "bfloat16"

# Track A: Simulated Accuracy Benchmark (ModelOpt + PyTorch)
accuracy_benchmark:
  formats:
    - "fp16"
    - "fp8"
    - "nvfp4"
  calibration_samples: 128
  max_eval_samples: 500

# Track B: Real Systems Performance Benchmark (vLLM)
vllm_benchmark:
  enabled: true   # <--- MASTER SWITCH (set to false to skip vLLM runs)
  formats:
    - "fp16"
    - "fp8"
  num_prompts: 100
  input_len: 512
  output_len: 128
  gpu_memory_utilization: 0.85

output:
  dir: "./outputs/llama_3.1_8b"
  save_plots: true